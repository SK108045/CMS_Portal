function sum(a){return a.reduce(function(t,n){return t+Number(n||0)},0)}
function catSpent(cat){return sum(db.transactions.filter(function(t){return t.category===cat && t.type!=="Income" && t.status!=="Cancelled"}).map(function(t){return t.amount}))}
function balance(cat){var b=db.budgets.find(function(x){return x.name===cat});return (b?b.amount:0)-catSpent(cat)}
function totalBudget(){return sum(db.budgets.map(function(b){return b.amount}))}
function expenses(){return sum(db.transactions.filter(function(t){return t.type!=="Income"&&t.status!=="Cancelled"}).map(function(t){return t.amount}))}
function income(){return sum(db.transactions.filter(function(t){return t.type==="Income"}).map(function(t){return t.amount}))}
function pending(){return db.requests.filter(function(r){return r.status==="Submitted"||r.status==="Under Review"})}

function newBudget(index){var b=index==null?null:db.budgets[index];openModal(b?"Edit Budget Allocation":"New Budget Category",fields([["name","Category Name","text",b?b.name:"", "required "+(b?"readonly":"")],["amount","Allocated Amount (KES)","number",b?b.amount:"","required min=\"0\""]]));formHandler(function(f){var amount=Number(f.amount);if(!b&&db.budgets.some(function(x){return x.name.toLowerCase()===f.name.trim().toLowerCase()})){toast("This budget category already exists.");return}if(b)b.amount=amount;else db.budgets.push({name:f.name.trim(),amount:amount});audit((b?"Updated":"Created")+" budget "+f.name+" to "+fmt(amount));save();close();render();toast("Budget updated")})}
function newTransaction(forced){var opts=["Income","Expense","Purchase","Petty Cash","Adjustment"].map(function(x){return '<option '+(forced===x?"selected":"")+'>'+x+'</option>'}).join("");openModal(forced==="Income"?"Record School Income":"Record Financial Transaction",fields([["type","Transaction Type","select","",opts],["date","Date","date",today(),"required"],["amount","Amount (KES)","number","","required min=\"1\""],["category","Budget Category / Income Source","select","",catOptions()+'<option>Donations</option><option>Grants</option><option>Church Support</option><option>Fundraising</option><option>Other Income</option>'],["description","Purpose / Description","textarea","","required"],["person","Responsible Person / Source","text","School Administrator","required"],["method","Payment Method","select","",["Bank Transfer","M-Pesa","Cash","Cheque","Other"].map(function(x){return "<option>"+x+"</option>"}).join("")],["request","Related Purchase Request ID (optional)"],["approvedBy","Approved By (if applicable)","text",db.settings.approver],["document","Receipt / Invoice / Proof","file"]]));formHandler(function(f){var type=f.type,doc=f.document,cat=f.category;var tx={id:"TX-"+String(Date.now()).slice(-7),date:f.date,amount:Number(f.amount),type:type,category:cat,description:f.description,person:f.person,method:f.method,request:f.request,approvedBy:f.approvedBy,approvedAt:f.approvedBy?now():"",document:doc,status:doc?"Completed":"Incomplete",history:[{at:now(),text:"Recorded by School Administrator"},{at:now(),text:fmt(f.amount)+" "+type.toLowerCase()+" recorded"}]};db.transactions.unshift(tx);if(f.request){var r=db.requests.find(function(x){return x.id===f.request});if(r){r.history.push({at:now(),text:fmt(f.amount)+" recorded as paid ("+tx.id+")"});if(r.status==="Approved")r.status="Completed"}}audit("Recorded "+tx.id+" for "+fmt(tx.amount));save();close();render();toast(doc?"Transaction recorded":"Transaction saved — supporting document required")})}
function newPetty(replenish){openModal(replenish?"Replenish Petty Cash":"Record Petty Cash Expense",fields([["date","Date","date",today(),"required"],["person",replenish?"Source of Funds":"Person Receiving Money","text","","required"],["purpose","Purpose","text",replenish?"Petty cash replenishment":"","required"],["amount","Amount (KES)","number","","required min=\"1\""],["recordedBy","Recorded By","text","School Administrator","required"],["document","Receipt / Proof","file"]]));formHandler(function(f){if(!replenish&&Number(f.amount)>pettyBalance()){toast("Petty cash balance is insufficient.");return}db.petty.unshift({id:"PC-"+Date.now(),date:f.date,person:f.person,purpose:f.purpose,amount:Number(f.amount),recordedBy:f.recordedBy,document:f.document,type:replenish?"Replenishment":"Expense"});audit((replenish?"Replenished":"Paid out")+" petty cash "+fmt(f.amount));save();close();render();toast("Petty cash updated")})}
function decision(status){var r=db.requests.find(function(x){return x.id===selectedRequest})||pending()[0];if(!r){toast("Select a request first");return}openModal(status+" · "+r.id,'<p><b>'+esc(r.item)+'</b> · '+fmt(r.amount)+'</p><form id="modal-form" class="form-grid"><label class="full">Decision Note (optional)<textarea name="note" rows="3" placeholder="Reason or comments"></textarea></label><div class="row full"><button class="btn red" type="submit">Confirm '+esc(status)+'</button>'+btn("Cancel","close-modal","outline")+'</div></form>');formHandler(function(f){r.status=status;r.history.push({at:now(),text:status+" by "+db.settings.approver+(f.note?" — "+f.note:"")});audit(r.id+" "+status.toLowerCase()+" by "+db.settings.approver);save();close();render();toast("Request "+status.toLowerCase())})}
function showTransaction(id){var t=db.transactions.find(function(x){return x.id===id});if(!t)return;var r=db.requests.find(function(x){return x.id===t.request}),documented=!!t.document,rows=[["Transaction ID",t.id],["Date",day(t.date)],["Purpose",t.description],["Amount",fmt(t.amount)],["Type",t.type],["Budget Category",t.category],["Responsible Person",t.person],["Payment Method",t.method],["Related Request",t.request||"None"],["Requested By",r?r.requester:"Not linked"],["Approved By",t.approvedBy||"Not recorded"],["Approval Date",stamp(t.approvedAt)],["Balance After Recorded Payment",db.budgets.some(function(b){return b.name===t.category})?fmt(balance(t.category)):"Not applicable"]];openModal("Transaction Accountability · "+id,(documented?pill("Documented"):pill("Supporting Document Required"))+'<div class="space"></div>'+rows.map(function(x){return '<div class="detail-line"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>'}).join("")+'<p><b>Supporting Document:</b> '+(documented?esc(t.document):"No document attached")+'</p><h3>Transaction History</h3><div class="activity">'+(t.history||[]).map(function(h){return '<p>'+esc(h.text)+' <small>'+stamp(h.at)+'</small></p>'}).join("")+'</div><div class="space"></div>'+(!documented?btn("Attach Supporting Document","attach:"+t.id,"red"):"")+' '+btn("Close","close-modal","outline"))}
function attach(id){var t=db.transactions.find(function(x){return x.id===id});if(!t)return;openModal("Attach Supporting Document",fields([["document","Receipt, invoice, or payment confirmation","file","","required"]]));formHandler(function(f){if(!f.document){toast("Choose a document");return}t.document=f.document;t.status="Completed";t.history=t.history||[];t.history.push({at:now(),text:"Supporting document attached: "+f.document});audit("Document attached to "+id);save();close();render();toast("Supporting document recorded")})}
function close(){document.querySelector(".modal-bg")?.remove()}
function csv(name,rows){var data=rows.map(function(row){return row.map(function(x){return '"'+String(x==null?"":x).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");var blob=new Blob(["\ufeff"+data],{type:"text/csv;charset=utf-8"});var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(url)},500)}
function exportTransactions(){csv("CMS_Transactions.csv",[["ID","Date","Purpose","Category","Type","Amount KES","Person","Payment Method","Request","Approver","Approved At","Document","Status"]].concat(db.transactions.map(function(t){return [t.id,t.date,t.description,t.category,t.type,t.amount,t.person,t.method,t.request,t.approvedBy,t.approvedAt,t.document,t.status]})))}
function exportReport(){csv("CMS_Financial_Report.csv",[["Category","Budget KES","Spent KES","Remaining KES","Status"]].concat(db.budgets.map(function(b){return [b.name,b.amount,catSpent(b.name),balance(b.name),warn(b)]})).concat([["Total",totalBudget(),expenses(),totalBudget()-expenses(),""],["Income Received",income(),"","",""],["Pending Approvals",pending().length,"","",""],["Missing Documents",db.transactions.filter(function(t){return !t.document}).length,"","",""]]))}
document.addEventListener("click",function(e){var page=e.target.closest("[data-page]");if(page){PAGE=page.dataset.page;sidebar=false;menu=false;filter={};render();return}var a=e.target.closest("[data-action]");if(!a)return;var action=a.dataset.action;if(action==="close-modal")return close();if(action==="toggle-side"){sidebar=!sidebar;render();return}if(action==="profile"){menu=!menu;render();return}if(action==="logout"){fetch("/api/logout",{method:"POST",credentials:"include"}).finally(function(){localStorage.removeItem(AUTH);currentUser=null;menu=false;clearTourFocus();render()});return}if(action==="tutorial"){menu=false;startTour(true);return}if(action==="tour-next"){tourIndex++;showTourStep();return}if(action==="tour-skip"){finishTour();return}if(action==="notifications"){toast(pending().length+" purchase requests awaiting approval");return}if(action==="new-request")return newRequest();if(action==="new-budget")return newBudget(null);if(action==="new-transaction")return newTransaction("Expense");if(action==="new-income")return newTransaction("Income");if(action==="new-petty")return newPetty(false);if(action==="replenish")return newPetty(true);if(action==="goto-transactions"){PAGE="transactions";render();return}if(action==="export-transactions")return exportTransactions();if(action==="export-report")return exportReport();if(action==="print-report")return window.print();if(action==="submit-settings"){document.querySelector('[data-form="settings"]')?.requestSubmit();return}if(action==="reset-demo"){if(confirm("Reset all browser demo data? This cannot be undone.")){db=seed();save();render();toast("Demo data reset")}return}if(action.startsWith("category:"))return newBudget(Number(action.split(":")[1]));if(action.startsWith("transaction:"))return showTransaction(action.split(":")[1]);if(action.startsWith("attach:"))return attach(action.split(":")[1]);if(action.startsWith("request:")){selectedRequest=action.split(":")[1];PAGE="requests";render();return}if(action.startsWith("decision:"))return decision(action.split(":")[1])});
